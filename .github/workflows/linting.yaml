name: Linting and Formatting

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: lint-ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint-and-format:
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              id: python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Cache pre-commit environments
              uses: actions/cache@v4
              with:
                path: ~/.cache/pre-commit
                key: pre-commit-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml', 'scripts/ci/requirements.lock') }}

            - name: Install pre-commit
              run: |
                python -m pip install -c scripts/ci/requirements.lock pre-commit

            - name: Run pre-commit
              run: pre-commit run --all-files --show-diff-on-failure
